spring.datasource.url=jdbc:h2:mem:edusearch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.cache.type=none
spring.data.redis.repositories.enabled=false
spring.task.scheduling.enabled=false

app.seed.enabled=false
app.monitoring.audit.enabled=false
app.monitoring.audit.include-success=false

app.jwt.secret=01234567890123456789012345678901
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

app.pubmed.api.timeout=5000
app.pubmed.api.max-retries=0
app.pubmed.api.detail-batch-size=10
app.pubmed.api.max-in-memory-size-bytes=2097152
app.external-health.timeout-ms=2000
app.external-health.max-retries=0

security.ip.whitelist=127.0.0.1,::1,localhost
