# Production profile - CORS muy restrictivo
spring.config.activate.on-profile=prod

# CORS para producción - SOLO dominio permitido
security.cors.allowed-origins[0]=https://frontend.uci.cu
security.cors.allowed-origins[1]=https://www.frontend.uci.cu
security.cors.allowed-methods[0]=GET
security.cors.allowed-methods[1]=POST
security.cors.allowed-methods[2]=PUT
security.cors.allowed-methods[3]=DELETE
security.cors.allowed-methods[4]=PATCH
security.cors.allowed-methods[5]=OPTIONS
security.cors.allowed-headers[0]=Authorization
security.cors.allowed-headers[1]=Content-Type
security.cors.allowed-headers[2]=Accept
security.cors.allowed-headers[3]=Origin
security.cors.allowed-headers[4]=X-Requested-With
security.cors.allowed-headers[5]=X-UCI-Platform
security.cors.allowed-headers[6]=X-User-Role
app.security.trust-proxy-headers=true
app.auth.password-reset.expose-dev-link=false

# IP Whitelist más restrictivo - SOLO IPs de tu infraestructura
# Actualizar con las IPs reales de tus servidores
security.ip.whitelist=10.0.0.0,10.0.0.1,10.0.0.2

# SSL/TLS
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# HSTS strict
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Deshabilitar herramientas de debug
logging.level.root=WARN
logging.level.com.uci.competencia=INFO
logging.level.org.springframework.security=WARN

# Swagger deshabilitado en producción
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
