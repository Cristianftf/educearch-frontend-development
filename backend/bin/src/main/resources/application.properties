spring.application.name=uci-competencia-informacional

# ============================================================
# CONFIGURACION PRINCIPAL - EDUCEARCH
# ============================================================
# Perfiles disponibles:
#   default -> application.properties (desarrollo local)
#   prod    -> application-prod.properties (produccion con SSL)
#   test    -> application-test.properties (tests unitarios)
#   integration -> application-integration.properties (tests de integracion)
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# ============================================================
# CORS (default para desarrollo, para produccion usar perfil prod)
# ============================================================
app.cors.allowed-origin-patterns=http://localhost:3000,http://localhost:3001,http://localhost:8080,https://frontend.uci.cu,https://*.tunnelmole.net,http://*.tunnelmole.net,https://*.tunnelmole.com,http://*.tunnelmole.com
security.cors.allowed-origins[0]=http://localhost:3000
security.cors.allowed-origins[1]=http://localhost:3001
security.cors.allowed-origins[2]=http://localhost:8080
security.cors.allowed-origins[3]=https://*.tunnelmole.net
security.cors.allowed-origins[4]=http://*.tunnelmole.net
security.cors.allowed-origins[5]=https://*.tunnelmole.com
security.cors.allowed-origins[6]=http://*.tunnelmole.com
security.cors.allowed-methods[0]=GET
security.cors.allowed-methods[1]=POST
security.cors.allowed-methods[2]=PUT
security.cors.allowed-methods[3]=DELETE
security.cors.allowed-methods[4]=PATCH
security.cors.allowed-methods[5]=OPTIONS
security.cors.allowed-headers[0]=Authorization
security.cors.allowed-headers[1]=Content-Type
security.cors.allowed-headers[2]=Accept
security.cors.allowed-headers[3]=Origin
security.cors.allowed-headers[4]=X-Requested-With
security.cors.allowed-headers[5]=X-UCI-Platform
security.cors.allowed-headers[6]=X-User-Role
security.cors.allow-credentials=true
security.cors.max-age=3600

# IP Whitelist (default para desarrollo)
security.ip.whitelist=127.0.0.1,::1,localhost

# ============================================================
# Base de Datos (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/uci_competencia
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Flyway (Migraciones de Base de Datos)
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ============================================================
# Logging (default para desarrollo)
# ============================================================
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.uci.competencia=DEBUG

# ============================================================
# Redis / Cache
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# ============================================================
# JWT (Seguridad)
# ============================================================
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000
app.auth.password-reset.expiration-ms=900000
app.auth.password-reset.expose-dev-link=true
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# ============================================================
# PubMed API (Busqueda Academica)
# ============================================================
app.pubmed.api.base-url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils
app.pubmed.api.key=${PUBMED_API_KEY:}
app.pubmed.api.timeout=30000
app.pubmed.api.max-retries=3
app.pubmed.api.detail-batch-size=10
app.pubmed.api.max-in-memory-size-bytes=1048576
app.pubmed.api.tool=${PUBMED_TOOL:uci-competencia}
app.pubmed.api.email=${PUBMED_EMAIL:}

# MeSH Lookup
app.mesh.api.base-url=https://id.nlm.nih.gov/mesh

# External Health Search
app.external-health.timeout-ms=2500
app.external-health.max-retries=1
app.external-health.cache-ttl-ms=1800000

# ============================================================
# Google AI / Gemini (Asistente IA)
# ============================================================
app.ai.provider=${AI_PROVIDER:gemini}
app.google.ai.api.key=${GOOGLE_AI_API_KEY:AIzaSyA06q6BH7mogkHrPKseEenkawYYt7IgoU4}
app.google.ai.base-url=${GOOGLE_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
app.google.ai.model=${GOOGLE_AI_MODEL:gemini-3-flash-preview}
app.google.ai.sdk-enabled=${GOOGLE_AI_SDK_ENABLED:false}
app.google.ai.temperature=${GOOGLE_AI_TEMPERATURE:1.0}
app.google.ai.max-tokens=${GOOGLE_AI_MAX_TOKENS:20000}
app.google.ai.timeout=${GOOGLE_AI_TIMEOUT:20000}
app.google.ai.max-retries=${GOOGLE_AI_MAX_RETRIES:2}
app.google.ai.retry-delay-ms=${GOOGLE_AI_RETRY_DELAY_MS:2000}

# ============================================================
# Metadatos de la Aplicacion
# ============================================================
app.name=Plataforma de Competencias Informacionales en Salud
app.version=1.0.0

# ============================================================
# Rate Limiting (Protección DoS)
# ============================================================
app.rate-limit.default-capacity=100
app.rate-limit.default-refill=50
app.rate-limit.default-refill-minutes=1
app.rate-limit.auth-capacity=20
app.rate-limit.auth-refill=10
app.rate-limit.auth-refill-minutes=1
app.rate-limit.api-capacity=200
app.rate-limit.api-refill=100
app.rate-limit.api-refill-minutes=1

# ============================================================
# Seguridad de Peticiones
# ============================================================
app.security.max-content-length=5242880
app.security.max-content-length-auth=10240
app.security.trust-proxy-headers=false
app.security.hsts-max-age=31536000
app.security.csp-report-uri=

# ============================================================
# Protección SSRF (Server-Side Request Forgery)
# ============================================================
app.ssrf.enabled=true
app.ssrf.resolve-dns=true
app.ssrf.allowed-domains=ncbi.nlm.nih.gov,id.nlm.nih.gov,eutils.ncbi.nlm.nih.gov,generativelanguage.googleapis.com,www.ncbi.nlm.nih.gov

# ============================================================
# Monitoreo y Auditoria
# ============================================================
app.monitoring.audit.enabled=true
app.monitoring.audit.include-success=true
app.monitoring.audit.max-details-length=4000
app.monitoring.error-analysis.enabled=true
app.monitoring.error-analysis-interval-ms=60000
app.monitoring.error-analysis-window-minutes=120
app.monitoring.error-analysis-batch-size=40

# ============================================================
# Server Configuration (Seguridad Adicional)
# ============================================================
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Tamaño máximo de peticiones
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Timeout de conexiones (Spring Boot 4.x)
server.tomcat.connection-timeout=30000
server.tomcat.max-connections=200
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-swallow-size=2MB

# ============================================================
# Seed de Usuarios de Prueba (DataInitializer)
# ============================================================
app.seed.enabled=true
