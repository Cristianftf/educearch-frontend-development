spring.application.name=uci-competencia-informacional

# Basic configurations
server.port=8080
server.servlet.context-path=/

# CORS Configuration (restrictive)
# En producción, cambiar a solo los dominios permitidos
app.cors.allowed-origin-patterns=http://localhost:3000,http://localhost:3001,http://localhost:8080,https://frontend.uci.cu,https://*.tunnelmole.net,http://*.tunnelmole.net,https://*.tunnelmole.com,http://*.tunnelmole.com
security.cors.allowed-origins[0]=http://localhost:3000
security.cors.allowed-origins[1]=https://frontend.uci.cu
security.cors.allowed-methods[0]=GET
security.cors.allowed-methods[1]=POST
security.cors.allowed-methods[2]=PUT
security.cors.allowed-methods[3]=DELETE
security.cors.allowed-methods[4]=PATCH
security.cors.allowed-methods[5]=OPTIONS
security.cors.allowed-headers[0]=Authorization
security.cors.allowed-headers[1]=Content-Type
security.cors.allow-credentials=true
security.cors.max-age=3600

# IP Whitelist para endpoints sensibles (admin, metrics, swagger)
# En producción, añadir solo las IPs de tus servidores de admin
security.ip.whitelist=127.0.0.1,::1,localhost

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/uci_competencia
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable JPA open-in-view to prevent N+1 queries and improve performance
spring.jpa.open-in-view=false

# JPA/Hibernate optimization for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Datasource pool optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway configuration
# Configurado en: META-INF/spring-configuration-metadata.json
# Las migraciones se ejecutan automáticamente desde: classpath:db/migration/
# Patrón de archivo: V{version}__{description}.sql
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging configuration (reduce verbosity)
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=redis

# Disable Redis repositories auto-configuration since we use JPA
spring.data.redis.repositories.enabled=false

# JWT Configuration
# Nota: Las claves sensibles deben configurarse mediante variables de entorno
# Variables de entorno esperadas: JWT_SECRET, JWT_EXPIRATION, JWT_REFRESH_EXPIRATION
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# PubMed API Configuration - Usando propiedades personalizadas configurables
app.pubmed.api.base-url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils
app.pubmed.api.key=${PUBMED_API_KEY:}
app.pubmed.api.timeout=30000
app.pubmed.api.max-retries=3
app.pubmed.api.detail-batch-size=10
app.pubmed.api.max-in-memory-size-bytes=1048576
app.pubmed.api.tool=${PUBMED_TOOL:uci-competencia}
app.pubmed.api.email=${PUBMED_EMAIL:}

# MeSH Lookup Configuration
app.mesh.api.base-url=https://id.nlm.nih.gov/mesh

# External Health Search Proxy (backend fallback aggregator)
app.external-health.timeout-ms=2500
app.external-health.max-retries=1
app.external-health.cache-ttl-ms=1800000
app.ai.provider=${AI_PROVIDER:gemini}
app.google.ai.api.key=AIzaSyA06q6BH7mogkHrPKseEenkawYYt7IgoU4
app.google.ai.base-url=${GOOGLE_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
app.google.ai.model=${GOOGLE_AI_MODEL:gemini-3-flash-preview}
app.google.ai.sdk-enabled=${GOOGLE_AI_SDK_ENABLED:false}
app.google.ai.temperature=${GOOGLE_AI_TEMPERATURE:1.0}
app.google.ai.max-tokens=${GOOGLE_AI_MAX_TOKENS:20000}
app.google.ai.timeout=${GOOGLE_AI_TIMEOUT:20000}
app.google.ai.max-retries=${GOOGLE_AI_MAX_RETRIES:2}
app.google.ai.retry-delay-ms=${GOOGLE_AI_RETRY_DELAY_MS:2000}

# Application Metadata
app.name=Plataforma de Competencias Informacionales en Salud
app.version=1.0.0

# Admin observability and AI error monitoring
app.monitoring.audit.enabled=true
app.monitoring.audit.include-success=true
app.monitoring.audit.max-details-length=4000
app.monitoring.error-analysis.enabled=true
app.monitoring.error-analysis-interval-ms=60000
app.monitoring.error-analysis-window-minutes=120
app.monitoring.error-analysis-batch-size=40

# Seed de usuarios de prueba (activar para entornos locales)
app.seed.enabled=true
