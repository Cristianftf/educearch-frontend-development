spring.application.name=uci-competencia-informacional

# Basic configurations
server.port=8080
server.servlet.context-path=/

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/uci_competencia
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable JPA open-in-view to prevent N+1 queries and improve performance
spring.jpa.open-in-view=false

# JPA/Hibernate optimization for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Datasource pool optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway configuration
# Configurado en: META-INF/spring-configuration-metadata.json
# Las migraciones se ejecutan automáticamente desde: classpath:db/migration/
# Patrón de archivo: V{version}__{description}.sql
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging configuration (reduce verbosity)
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=redis

# Disable Redis repositories auto-configuration since we use JPA
spring.data.redis.repositories.enabled=false

# JWT Configuration
# Nota: Las claves sensibles deben configurarse mediante variables de entorno
# Variables de entorno esperadas: JWT_SECRET, JWT_EXPIRATION, JWT_REFRESH_EXPIRATION
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# PubMed API Configuration - Usando propiedades personalizadas configurables
app.pubmed.api.base-url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils
app.pubmed.api.key=${PUBMED_API_KEY:}
app.pubmed.api.timeout=30000
app.pubmed.api.max-retries=3
app.pubmed.api.tool=${PUBMED_TOOL:uci-competencia}
app.pubmed.api.email=${PUBMED_EMAIL:}

# MeSH Lookup Configuration
app.mesh.api.base-url=https://id.nlm.nih.gov/mesh

# OpenAI Configuration (IA para verificación)
app.openai.api.base-url=https://api.openai.com/v1
app.openai.api.key=${OPENAI_API_KEY:}
app.openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.api.temperature=${OPENAI_TEMPERATURE:0.2}
app.openai.api.max-tokens=${OPENAI_MAX_TOKENS:800}
app.openai.api.timeout=30000

# Application Metadata
app.name=Plataforma de Competencias Informacionales en Salud
app.version=1.0.0

# Seed de usuarios de prueba (activar para entornos locales)
app.seed.enabled=true
