# ============================================================
# docker-compose.yml - EDUCEARCH
# ============================================================
# Despliegue completo con:
#   - Frontend (Next.js)
#   - Backend (Spring Boot)
#   - PostgreSQL
#   - Redis
# ============================================================

services:
  # --- Base de datos PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: educearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uci_competencia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educearch-network

  # --- Cache Redis ---
  redis:
    image: redis:7-alpine
    container_name: educearch-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeme}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educearch-network

  # --- Backend Spring Boot ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educearch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/uci_competencia
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-false}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      PUBMED_EMAIL: ${PUBMED_EMAIL:-}
    ports:
      - "8080:8080"
    networks:
      - educearch-network

  # --- Frontend Next.js ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080
        BACKEND_INTERNAL_URL: http://backend:8080
    container_name: educearch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - educearch-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  educearch-network:
    driver: bridge
